@if (app.activeTab === 'Nuevo artículo KB') {
  <section>
    <div class="mb-7">
      <button
        type="button"
        (click)="app.cambiarPestana('Base de conocimiento')"
        class="mb-4 text-sm font-semibold text-slate-500"
      >
        ← Base de conocimiento
      </button>
      <p class="mb-2 text-[11px] font-bold uppercase tracking-[0.16em] text-amber-700">
        Documentación interna
      </p>
      <h1 class="text-3xl font-bold tracking-tight text-slate-900 max-sm:text-2xl">
        Nuevo artículo KB
      </h1>
      <p class="mt-2 text-sm text-slate-500">
        El artículo se guardará como pendiente hasta que un administrador lo revise.
      </p>
    </div>
    <form
      (ngSubmit)="app.crearArticuloKB()"
      class="max-w-4xl space-y-5 rounded-xl border border-slate-200 bg-white p-6 shadow-sm max-sm:p-4"
    >
      <label class="block text-sm font-medium text-slate-700"
        >Título *<input
          name="kbTitle"
          [(ngModel)]="app.articuloNuevo.title"
          required
          minlength="3"
          maxlength="160"
          class="mt-2 h-11 w-full rounded-lg border border-slate-200 px-3 text-sm"
          placeholder="Ej. Restablecer acceso a la cuenta"
      /></label>
      <div class="grid grid-cols-1 gap-4 sm:grid-cols-3">
        <label class="text-sm font-medium text-slate-700"
          >Producto<input
            name="kbProduct"
            [(ngModel)]="app.articuloNuevo.productCode"
            class="mt-2 h-11 w-full rounded-lg border border-slate-200 px-3 text-sm" /></label
        ><label class="text-sm font-medium text-slate-700"
          >Módulo<input
            name="kbModule"
            [(ngModel)]="app.articuloNuevo.moduleCode"
            class="mt-2 h-11 w-full rounded-lg border border-slate-200 px-3 text-sm" /></label
        ><label class="text-sm font-medium text-slate-700"
          >Idioma<select
            name="kbLanguage"
            [(ngModel)]="app.articuloNuevo.language"
            class="mt-2 h-11 w-full rounded-lg border border-slate-200 bg-white px-3 text-sm"
          >
            <option value="es">Español</option>
            <option value="en">English</option>
          </select></label
        >
      </div>
      <label class="block text-sm font-medium text-slate-700"
        >Procedimiento y solución *<textarea
          name="kbContent"
          [(ngModel)]="app.articuloNuevo.content"
          required
          minlength="20"
          rows="10"
          placeholder="Describe los pasos, la solución y cómo verificar que quedó resuelto…"
          class="mt-2 w-full rounded-lg border border-slate-200 p-3 text-sm leading-6"
        ></textarea>
      </label>
      <div class="flex justify-end">
        <button
          type="submit"
          class="min-h-11 rounded-lg bg-amber-400 px-5 py-2.5 text-sm font-bold text-slate-950"
        >
          Enviar a revisión
        </button>
      </div>
    </form>
  </section>
}

<header
  class="sticky top-0 z-20 flex min-h-[68px] items-center justify-between gap-4 border-b border-slate-200 bg-white/95 px-8 backdrop-blur max-lg:px-5 max-sm:px-3"
>
  <div class="min-w-0">
    <p class="text-xs text-slate-500">
      Sildra Support <span class="mx-1 text-slate-300">/</span>
      <span class="font-semibold text-slate-800">{{ activeTab }}</span>
    </p>
  </div>
  <div class="flex shrink-0 items-center gap-4 max-sm:gap-2">
    <div class="flex items-center gap-2 text-xs font-medium text-emerald-700 max-sm:hidden">
      <span class="h-2 w-2 rounded-full bg-emerald-500"></span>
      Sistema operativo
    </div>
    <button
      type="button"
      (click)="commandsRequested.emit()"
      title="Abrir comandos (Ctrl/⌘ K)"
      class="min-h-9 rounded-lg border border-slate-200 px-3 text-xs font-semibold text-slate-600 transition hover:bg-slate-50"
    >
      ⌘K <span class="text-slate-400">Atajos</span>
    </button>
    <div
      class="grid h-9 w-9 place-items-center rounded-full border border-slate-200 bg-amber-100 text-xs font-bold text-amber-900"
    >
      {{ iniciales }}
    </div>
    <span
      class="rounded-md bg-slate-100 px-2.5 py-1.5 text-xs font-semibold text-slate-600 max-sm:hidden"
      >{{ roleLabel }}</span
    >
    <button
      type="button"
      (click)="logoutRequested.emit()"
      class="min-h-9 rounded-lg border border-slate-200 px-3 text-xs font-semibold text-slate-600 transition hover:bg-slate-50"
    >
      Salir
    </button>
  </div>
</header>

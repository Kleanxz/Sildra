name: sildra-local

services:
  db:
    image: postgres:18.6
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:?Define DB_NAME in .env}
      POSTGRES_USER: ${DB_USER:?Define DB_USER in .env}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Define DB_PASSWORD in .env}
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    volumes:
      - sildra-postgres-data:/var/lib/postgresql
      - ../Sildra/database/sildra_db_2026-10-20.sql:/docker-entrypoint-initdb.d/001-sildra.sql:ro

volumes:
  sildra-postgres-data:
